<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>7초 단어 시험</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:0 auto;padding:28px 18px}.card{background:#fff;border-radius:22px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.08)}h1,h2{margin:0 0 10px}.sub{color:#666;margin:0 0 24px}.field{margin:14px 0}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}input,select,button{width:100%;border-radius:13px;font-size:17px;padding:14px}input,select{border:1px solid #d7dbe5;background:#fff}button{border:0;background:#111;color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#eef1f6;color:#111}.hidden{display:none}.word{font-size:52px;font-weight:900;text-align:center;margin:36px 0 10px;word-break:break-word}.timer{text-align:center;font-size:30px;font-weight:800;margin-bottom:22px}.meta{display:flex;justify-content:space-between;color:#666;font-size:14px}.feedback{padding:16px;border-radius:14px;margin:14px 0}.ok{background:#eaf8ee;color:#176b2c}.no{background:#fff0f0;color:#a42626}.muted{color:#777;font-size:14px}.result-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}.metric{background:#f6f7fa;border-radius:15px;padding:16px;text-align:center}.metric b{display:block;font-size:24px;margin-top:5px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}.ranking{margin-top:28px;padding-top:22px;border-top:1px solid #eee}@media(max-width:560px){.result-row{grid-template-columns:1fr}.card{padding:20px}.word{font-size:42px}}
.auto-next{margin-top:16px;padding-top:12px;border-top:1px solid currentColor}.auto-next-label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;font-weight:700}.auto-next-time{font-variant-numeric:tabular-nums;white-space:nowrap}.auto-next-track{height:8px;margin-top:9px;border-radius:999px;background:rgba(0,0,0,.1);overflow:hidden}.auto-next-fill{height:100%;background:currentColor;border-radius:inherit;transform-origin:left;will-change:transform}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<section id="setup">
<h1>📚 7초 단어 시험</h1>
<p class="sub">닉네임을 입력하고 단어장을 선택하세요. 전체 문제를 다 풀면 최고 점수가 랭킹에 기록됩니다.</p>
<div class="field"><label>닉네임</label><input id="nickname" maxlength="16" placeholder="2~16자 닉네임" autocomplete="off" /></div>
<div class="field"><label>단어장 선택</label><select id="set"></select></div>
<p id="setInfo" class="muted"></p>
<button id="start">시험 시작</button>
<div id="status" class="muted" style="margin-top:10px">랭킹 공정성을 위해 정답은 엄격하게 판정됩니다.</div>
<div class="ranking"><h2>🏆 TOP 10</h2><div id="rankingSetup" class="muted">랭킹 불러오는 중...</div></div>
</section>
<section id="quiz" class="hidden">
<div class="meta"><span id="progress"></span><span id="scoreNow"></span></div>
<div id="word" class="word"></div>
<div class="timer">⏱ <span id="time">7.0</span>초</div>
<input id="answer" autocomplete="off" placeholder="한국어 뜻 입력 후 Enter" />
<div style="height:10px"></div><button id="submit">제출</button>
<div id="feedback"></div>
<button id="next" class="secondary hidden">다음 문제</button>
</section>
<section id="done" class="hidden">
<h1>🎉 시험 완료</h1>
<p id="playerResult" class="sub"></p>
<div class="result-row"><div class="metric">정답<b id="mScore"></b></div><div class="metric">정답률<b id="mRate"></b></div></div>
<div id="saveStatus" class="feedback">랭킹 저장 중...</div>
<div id="wrong"></div>
<div class="ranking"><h2>🏆 TOP 10</h2><div id="rankingDone" class="muted">랭킹 불러오는 중...</div></div>
<div style="height:16px"></div><button onclick="location.reload()">다시 시작</button>
</section>
</div></div>
<script type="module">
import { loadRanking, saveScore } from './ranking.js';
const TIME_LIMIT=7;
const FEEDBACK_DELAY=2000;
const VOCAB_SETS={'기본 단어장':[
{english:'abandon',korean:'버리다, 포기하다'},{english:'accurate',korean:'정확한, 정밀한'},{english:'consume',korean:'소비하다, 섭취하다'},{english:'purchase',korean:'구매하다, 사다'},{english:'reduce',korean:'줄이다, 감소시키다'},{english:'maintain',korean:'유지하다'},{english:'require',korean:'요구하다, 필요로 하다'},{english:'increase',korean:'증가하다, 늘리다'},{english:'provide',korean:'제공하다'},{english:'consider',korean:'고려하다, 생각하다'}]};
VOCAB_SETS['챕터 1']=[
  {
    "english": "resume",
    "korean": "이력서"
  },
  {
    "english": "opening",
    "korean": "공석, 결원, 개장, 개시"
  },
  {
    "english": "applicant",
    "korean": "지원자, 신청자"
  },
  {
    "english": "requirement",
    "korean": "필요조건, 요건"
  },
  {
    "english": "meet",
    "korean": "만족시키다"
  },
  {
    "english": "qualified",
    "korean": "자격있는, 적격의"
  },
  {
    "english": "candidate",
    "korean": "후보자, 지원자"
  },
  {
    "english": "confidence",
    "korean": "확신, 자신, 신임"
  },
  {
    "english": "highly",
    "korean": "매우, 대단히"
  },
  {
    "english": "professional",
    "korean": "전문적인, 직업의"
  },
  {
    "english": "interview",
    "korean": "면접, 면접을 보다"
  },
  {
    "english": "hire",
    "korean": "고용하다"
  },
  {
    "english": "training",
    "korean": "교육, 훈련"
  },
  {
    "english": "reference",
    "korean": "추천서, 참고"
  },
  {
    "english": "position",
    "korean": "일자리, 직책, 두다"
  },
  {
    "english": "achievement",
    "korean": "성취, 달성"
  },
  {
    "english": "impressed",
    "korean": "인상 깊게 생각하는, 감명을 받은"
  },
  {
    "english": "excellent",
    "korean": "훌륭한, 탁월한"
  },
  {
    "english": "eligible",
    "korean": "자격이 있는, 적격의"
  },
  {
    "english": "identify",
    "korean": "알아보다, 확인하다"
  },
  {
    "english": "associate",
    "korean": "관련시키다"
  },
  {
    "english": "condition",
    "korean": "조건"
  },
  {
    "english": "employment",
    "korean": "고용"
  },
  {
    "english": "lack",
    "korean": "~이 없다, 부족"
  },
  {
    "english": "managerial",
    "korean": "관리의"
  },
  {
    "english": "diligent",
    "korean": "성실한"
  },
  {
    "english": "familiar",
    "korean": "익숙한, 친숙한"
  },
  {
    "english": "proficiency",
    "korean": "숙달, 능숙"
  },
  {
    "english": "prospective",
    "korean": "장래의, 미래의"
  },
  {
    "english": "appeal",
    "korean": "관심을 끌다, 매력적이다"
  },
  {
    "english": "specialize",
    "korean": "~를 전공하다, 전문적으로 다루다"
  },
  {
    "english": "apprehensive",
    "korean": "걱정하는, 염려하는"
  },
  {
    "english": "consultant",
    "korean": "고문, 컨설턴트"
  },
  {
    "english": "entitle",
    "korean": "자격을 주다"
  },
  {
    "english": "degree",
    "korean": "학위"
  },
  {
    "english": "payroll",
    "korean": "임금 대장, 급료 명부"
  },
  {
    "english": "recruit",
    "korean": "모집하다"
  },
  {
    "english": "certification",
    "korean": "증명서, 증명"
  },
  {
    "english": "occupation",
    "korean": "직업"
  },
  {
    "english": "wage",
    "korean": "임금, 급료"
  }
];

const GENERIC_ANSWERS=new Set(['하다','되다','이다','시키다','있다','없다','것','거','수','함','함다','한다']);
const SAFE_SYNONYM_GROUPS=[
['구매하다','구입하다','사다'],
['줄이다','감소시키다'],
['고려하다','생각하다'],
['버리다','포기하다'],
['정확한','정밀한'],
['소비하다','섭취하다'],
['요구하다','필요로 하다'],
['증가하다','늘리다']
];
const $=id=>document.getElementById(id);let rows=[],questions=[],i=0,score=0,started=0,ticker=null,locked=false,results=[],playerName='',selectedSet='';
function initSets(){for(const name of Object.keys(VOCAB_SETS)){const o=document.createElement('option');o.value=name;o.textContent=name;$('set').appendChild(o)}updateSetInfo()}
function updateSetInfo(){const r=VOCAB_SETS[$('set').value]||[];$('setInfo').textContent='총 '+r.length+'문제 · 전체 문제 완료 시 랭킹 반영';loadRanking($('set').value,$('rankingSetup'))}
function norm(s){return String(s||'').trim().toLowerCase().replace(/[~!@#$%^&*()_+={}\[\]:"'<>?.\\-]/g,'').replace(/\s+/g,' ')}
function compact(s){return norm(s).replace(/\s/g,'')}
function answers(s){return String(s).split(/[,;/|·\n]+/).map(norm).filter(Boolean)}
function simple(u,c){u=norm(u);c=norm(c);if(!u||!c)return false;if(u===c)return true;for(const suf of ['하다','되다','시키다','이다']){if(c.endsWith(suf)){const stem=c.slice(0,-suf.length);if(stem.length>=2&&u===stem)return true}if(u.endsWith(suf)){const stem=u.slice(0,-suf.length);if(stem.length>=2&&c===stem)return true}}return false}
function isJamoOnly(s){const t=compact(s);return !!t&&/^[ㄱ-ㅎㅏ-ㅣ]+$/.test(t)}
function isTooGeneric(s){const t=compact(s);return GENERIC_ANSWERS.has(t)}
function sameSafeSynonym(a,b){a=norm(a);b=norm(b);return SAFE_SYNONYM_GROUPS.some(g=>g.includes(a)&&g.includes(b))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
async function judge(user,correct){const list=answers(correct),u=norm(user),uc=compact(user);if(!u)return{ok:false};if(list.some(c=>u===c))return{ok:true};if(isJamoOnly(u)||isTooGeneric(u)||uc.length<2)return{ok:false};for(const c of list){if(simple(u,c)||sameSafeSynonym(u,c))return{ok:true}}return{ok:false}}
function show(){if(i>=questions.length)return finish();locked=false;$('feedback').innerHTML='';$('next').classList.add('hidden');$('submit').classList.remove('hidden');$('answer').disabled=false;$('answer').value='';$('answer').focus();$('word').textContent=questions[i].english;$('progress').textContent='문제 '+(i+1)+' / '+questions.length;$('scoreNow').textContent='점수 '+score;started=performance.now();clearInterval(ticker);ticker=setInterval(()=>{const remain=Math.max(0,TIME_LIMIT-(performance.now()-started)/1000);$('time').textContent=remain.toFixed(1);if(remain<=0){clearInterval(ticker);submit(true)}},100)}
async function submit(timeout=false){if(locked)return;locked=true;clearInterval(ticker);$('answer').disabled=true;$('submit').classList.add('hidden');const q=questions[i],user=timeout?'':$('answer').value.trim();let r={ok:false};if(!timeout&&user)r=await judge(user,q.korean);if(r.ok)score++;results.push({english:q.english,user:user||'(시간 초과)',correct:q.korean,ok:r.ok});const destination=i===questions.length-1?'결과 보기까지':'다음 문제까지';
$('feedback').innerHTML='<div class="feedback '+(r.ok?'ok':'no')+'"><div role="status">'+(r.ok?'✅ 정답':timeout?'⏰ 시간 초과':'❌ 오답')+'<br>정답: '+esc(q.korean)+'</div><div class="auto-next"><div class="auto-next-label"><span>'+destination+'</span><span id="autoNextTime" class="auto-next-time" aria-hidden="true">2.0초</span></div><div class="auto-next-track" aria-hidden="true"><div id="autoNextFill" class="auto-next-fill"></div></div><span class="muted">자동으로 이동합니다.</span></div></div>';
startAutoNext()}
function startAutoNext(){
  const countdownStarted=performance.now();
  const time=$('autoNextTime'),fill=$('autoNextFill');
  let frame;
  function paint(){
    const remaining=Math.max(0,FEEDBACK_DELAY-(performance.now()-countdownStarted));
    time.textContent=(Math.ceil(remaining/100)/10).toFixed(1)+'초';
    fill.style.transform='scaleX('+(remaining/FEEDBACK_DELAY)+')';
    if(remaining>0)frame=requestAnimationFrame(paint);
  }
  paint();
  setTimeout(()=>{cancelAnimationFrame(frame);i++;show()},FEEDBACK_DELAY);
}

function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function finish(){clearInterval(ticker);$('quiz').classList.add('hidden');$('done').classList.remove('hidden');$('playerResult').textContent=playerName+' · '+selectedSet;$('mScore').textContent=score+'/'+questions.length;$('mRate').textContent=Math.round(score/questions.length*100)+'%';const w=results.filter(r=>!r.ok);$('wrong').innerHTML=w.length?'<h3>오답</h3><table><tr><th>영어</th><th>내 답</th><th>정답</th></tr>'+w.map(r=>'<tr><td>'+esc(r.english)+'</td><td>'+esc(r.user)+'</td><td>'+esc(r.correct)+'</td></tr>').join('')+'</table><br>':'<p class="feedback ok">전부 맞았습니다!</p>';await saveScore(playerName,selectedSet,score,questions.length,$('saveStatus'));await loadRanking(selectedSet,$('rankingDone'))}
$('start').onclick=()=>{playerName=$('nickname').value.trim();if(playerName.length<2||playerName.length>16)return alert('닉네임은 2~16자로 입력하세요.');selectedSet=$('set').value;rows=VOCAB_SETS[selectedSet]||[];$('status').textContent=selectedSet+' · '+rows.length+'문제 · 엄격 판정 모드';questions=shuffle(rows);$('setup').classList.add('hidden');$('quiz').classList.remove('hidden');show()};$('set').onchange=updateSetInfo;$('submit').onclick=()=>submit(false);$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')submit(false)});initSets();
</script></body></html>
